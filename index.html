<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendas Navideñas · LookMe Studio</title>
<meta name="description" content="Agenda tu cita navideña de cejas y pestañas con las artistas de LookMe Studio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F4ECE1'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='34' fill='%23B8944F'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TEMA DE MARCA — LookMe Studio
   Para otra clienta: cambia estas variables, las fuentes del <link> de
   arriba y el bloque CONFIG del <script>. El resto no se toca.
   ===================================================================== */
:root{
  --fondo:#FBF7F1;          /* crema */
  --fondo-2:#F3EADF;        /* beige claro */
  --beige:#E9DCCB;          /* beige */
  --borde:#E3D2BC;          /* líneas suaves */
  --cafe:#A57E5A;           /* café claro */
  --cafe-osc:#6F5139;       /* café para textos */
  --texto:#5E5047;
  --dorado:#B8944F;
  --oro: linear-gradient(135deg,#8C6A2E 0%,#D3AE62 28%,#F5E5BC 47%,#C49C50 66%,#8C6A2E 100%);
  --linea-oro: linear-gradient(90deg,transparent,#C9A55E 18%,#E9D29A 50%,#C9A55E 82%,transparent);
  --boton: linear-gradient(135deg,#8E6A49 0%,#B08A5E 55%,#C7A266 100%);
  --sombra: 0 10px 30px rgba(140,106,70,.14);
  --f-titulo:'Julius Sans One',sans-serif;
  --f-cuerpo:'Poppins',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--fondo-2)}
body{min-height:100vh;font-family:var(--f-cuerpo);font-weight:400;color:var(--texto);
  background:radial-gradient(ellipse at 50% 0%,#fffdf9 0%,var(--fondo) 40%,var(--fondo-2) 80%,var(--beige) 100%);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--dorado);outline-offset:3px;border-radius:8px}

/* ---------- fondo navideño ---------- */
#nieve{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.copo{position:absolute;top:-20px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.9),0 0 10px rgba(201,165,94,.7);animation:caer linear infinite;opacity:.9}
.copo.oro{color:#D9B86E;text-shadow:0 0 6px rgba(255,240,200,.9)}
@keyframes caer{to{transform:translateY(110vh) rotate(360deg)}}
.destello{position:absolute;width:16px;height:16px;pointer-events:none;animation:titilar 2.6s ease-in-out infinite}
.destello::before,.destello::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #E9D29A}
.destello::before{width:1.5px;height:16px}.destello::after{width:16px;height:1.5px}
@keyframes titilar{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}

.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 18px 70px}

/* esferas colgantes */
.colgantes{position:absolute;top:0;left:0;right:0;height:170px;pointer-events:none;z-index:2}
.esfera{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;animation:mecer 4s ease-in-out infinite;transform-origin:top center}
.esfera .hilo{width:1px;background:linear-gradient(#E9D29A,#B8944F)}
.esfera .bola{border-radius:50%;position:relative;box-shadow:inset -5px -7px 12px rgba(0,0,0,.12),inset 5px 5px 10px rgba(255,255,255,.75),0 6px 14px rgba(184,148,79,.28)}
.esfera .bola::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:10px;height:7px;border-radius:2px;background:var(--oro)}
@keyframes mecer{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ---------- tipografía ---------- */
.script{font-family:var(--f-titulo);font-weight:400;text-transform:uppercase;letter-spacing:.12em;line-height:1.05;color:var(--cafe-osc)}
.oro-txt{background:var(--oro);-webkit-background-clip:text;background-clip:text;color:transparent}
.serif{font-family:var(--f-cuerpo);font-weight:300;font-style:italic}
.eyebrow{font-family:var(--f-titulo);letter-spacing:.34em;text-transform:uppercase;font-size:12px;color:var(--dorado)}
.titulo{text-align:center}
.titulo .chico{display:block;font-size:clamp(15px,3.6vw,20px);letter-spacing:.3em;color:var(--cafe)}
.titulo .grande{display:block;font-size:clamp(34px,8.6vw,62px);margin-top:8px;background:var(--oro);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(184,148,79,.18))}
.pill{display:inline-block;background:rgba(255,255,255,.82);color:var(--texto);border-radius:999px;padding:13px 26px;font-weight:300;font-size:14.5px;box-shadow:var(--sombra);text-align:center;line-height:1.55;border:1px solid var(--borde)}
.linea{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--dorado);font-size:12px}
.linea::before,.linea::after{content:"";height:1px;width:min(110px,22vw);background:var(--linea-oro)}
.seccion-titulo{text-align:center;margin:48px 0 8px}
.seccion-titulo .script{font-size:clamp(24px,6vw,36px)}
.seccion-sub{text-align:center;font-weight:300;font-style:italic;font-size:15.5px;color:var(--cafe);margin:8px 0 22px}

/* logo de texto */
.logo{display:inline-flex;flex-direction:column;align-items:center;margin:0 auto 6px}
.logo .lm{font-family:var(--f-titulo);font-size:clamp(46px,12vw,72px);letter-spacing:.04em;line-height:1;background:var(--oro);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(184,148,79,.25))}
.logo .lm sup{font-size:.32em;vertical-align:top;margin-left:2px}
.logo .st{display:flex;align-items:center;gap:10px;font-family:var(--f-titulo);letter-spacing:.55em;font-size:clamp(11px,2.6vw,14px);color:var(--dorado);margin-top:6px;padding-left:.55em}
.logo .st::before,.logo .st::after{content:"";height:1px;width:clamp(36px,10vw,70px);background:var(--linea-oro)}
.logo.mini .lm{font-size:28px}.logo.mini .st{font-size:8px;letter-spacing:.45em;margin-top:2px}.logo.mini .st::before,.logo.mini .st::after{width:18px}

.logo-img{display:block;width:min(320px,70vw);height:auto;margin:0 auto 8px;filter:drop-shadow(0 4px 12px rgba(184,148,79,.25))}
.logo-img.mini{width:auto;height:40px;margin:0;filter:none}

/* ---------- bienvenida ---------- */
.hero{text-align:center;position:relative}
.portada{position:relative;margin:0 -18px}
.portada img{display:block;width:100%;max-width:640px;margin:0 auto;aspect-ratio:760/868;object-fit:cover;object-position:center top;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.5) 80%,transparent 97%);
          mask-image:linear-gradient(to bottom,#000 0%,#000 62%,rgba(0,0,0,.5) 80%,transparent 97%)}
@media (min-width:641px){
  .portada img{max-width:560px;
    -webkit-mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.5) 80%,transparent 97%),linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%);
    -webkit-mask-composite:source-in;
            mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.5) 80%,transparent 97%),linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%);
            mask-composite:intersect}
}
.hero-texto{position:relative;margin-top:-18%;z-index:2}
@media (min-width:641px){.hero-texto{margin-top:-110px}}
.hero .eyebrow{margin:14px 0 14px}
.hero .pill{margin-top:20px;max-width:560px}
.btn-catalogo{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:15px 30px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;letter-spacing:.04em;color:#fff;background:var(--boton);box-shadow:0 12px 26px rgba(140,106,70,.28),inset 0 0 0 1px rgba(255,255,255,.35);transition:transform .2s}
.btn-catalogo:hover{transform:translateY(-2px)}
.link-politicas{display:block;margin:16px auto 0;font-size:13.5px;font-weight:500;color:var(--cafe-osc);text-decoration:underline;text-decoration-color:var(--dorado);text-underline-offset:4px}

/* semanas */
.semanas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.semana{position:relative;border-radius:22px;padding:22px 14px 18px;text-align:center;background:linear-gradient(170deg,#fff 0%,var(--fondo) 60%,var(--fondo-2) 100%);border:1px solid var(--borde);box-shadow:var(--sombra);transition:transform .2s,box-shadow .2s,border-color .2s}
.semana::after{content:"";position:absolute;inset:5px;border-radius:17px;border:1px solid rgba(201,165,94,.35);pointer-events:none}
.semana:hover{transform:translateY(-4px);border-color:var(--dorado);box-shadow:0 16px 34px rgba(140,106,70,.2)}
.semana .num{font-family:var(--f-titulo);letter-spacing:.3em;font-size:11px;color:var(--dorado);text-transform:uppercase}
.semana .rango{font-family:var(--f-titulo);font-size:21px;letter-spacing:.06em;color:var(--cafe-osc);margin:10px 0 4px;line-height:1.15}
.semana .dias{font-size:12.5px;font-weight:300;color:var(--texto)}
.semana .tag{display:inline-block;margin-top:10px;background:#fff;color:var(--cafe);border:1px solid var(--borde);border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:500}
.semana .entrar{display:block;margin-top:12px;font-weight:500;color:var(--dorado);font-size:13px;letter-spacing:.04em}
.semana.pasada{opacity:.45;pointer-events:none}
.semana.pendiente,.artista.pendiente{pointer-events:none;filter:saturate(.7);opacity:.75}
.artista.pendiente img{filter:grayscale(.25)}

/* ---------- barra superior de pasos ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 4px}
.volver{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--cafe-osc);font-weight:500;padding:9px 16px;border-radius:999px;border:1px solid var(--borde);box-shadow:var(--sombra);font-size:13.5px}
.pasos{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.pasos span{width:34px;height:3px;border-radius:9px;background:var(--beige)}
.pasos span.on{background:var(--oro)}
.resumen-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 4px}
.chip{background:#fff;color:var(--texto);border:1px solid var(--borde);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:400}
.chip b{color:var(--cafe-osc);font-weight:600}

/* ---------- artistas ---------- */
.artistas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,260px));justify-content:center;gap:28px 22px}
.artista{position:relative;background:none;border:none;padding:22px 0 0;text-align:center;transition:transform .25s}
.artista:hover{transform:translateY(-6px)}
.artista .corona{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;z-index:3;filter:drop-shadow(0 2px 4px rgba(184,148,79,.4))}
.artista .marco-p{position:relative;padding:5px;background:var(--oro);border-radius:999px 999px 26px 26px;box-shadow:0 12px 26px rgba(140,106,70,.2)}
.artista .interior{position:relative;border-radius:999px 999px 22px 22px;overflow:hidden;padding-bottom:18px;background:linear-gradient(180deg,#fff 0%,var(--fondo) 60%,var(--fondo-2) 100%)}
.artista .interior::after{content:"";position:absolute;inset:6px;border-radius:999px 999px 17px 17px;border:1px solid rgba(201,165,94,.55);pointer-events:none}
.artista img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 20%;display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 60%,rgba(0,0,0,.5) 80%,transparent 98%);
          mask-image:linear-gradient(to bottom,#000 0%,#000 60%,rgba(0,0,0,.5) 80%,transparent 98%)}
.cinta{position:relative;display:inline-block;font-family:var(--f-titulo);text-transform:uppercase;letter-spacing:.22em;color:var(--cafe-osc);font-size:18px;padding:8px 20px;background:rgba(255,255,255,.9);border-top:1px solid var(--dorado);border-bottom:1px solid var(--dorado)}
.artista .cinta{margin-top:-30px;z-index:2;font-size:16px}
.artista .frase{margin:10px 14px 0;font-size:12.5px;font-weight:300;font-style:italic;color:var(--cafe-osc)}
.artista .ver{display:inline-block;margin-top:12px;background:var(--boton);color:#fff;border-radius:999px;padding:8px 18px;font-weight:500;font-size:12.5px;letter-spacing:.04em;box-shadow:0 6px 14px rgba(140,106,70,.25)}
.artista.pendiente .ver{background:#fff;color:var(--cafe)}

/* ---------- agenda ---------- */
.perfil{display:flex;align-items:center;gap:16px;justify-content:center;margin:12px 0 0}
.perfil img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:center 15%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--dorado),var(--sombra)}
.perfil .script{font-size:30px}
.perfil .serif{font-size:14.5px;color:var(--cafe);margin-top:4px}
.panel-card{background:rgba(255,255,255,.78);backdrop-filter:blur(6px);border:1px solid var(--borde);border-radius:24px;padding:24px 18px;box-shadow:var(--sombra);margin-top:22px;position:relative}
.panel-card h3{font-family:var(--f-titulo);font-weight:400;text-transform:uppercase;letter-spacing:.16em;color:var(--cafe-osc);font-size:20px;text-align:center;margin-bottom:16px}
.panel-card h3::after{content:"";display:block;width:70px;height:1px;margin:12px auto 0;background:var(--linea-oro)}
.dias-sel{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.dia{flex:0 0 auto;min-width:86px;scroll-snap-align:start;border-radius:18px;padding:12px 10px;text-align:center;background:#fff;border:1px solid var(--borde);transition:all .2s}
.dia .dsem{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--dorado)}
.dia .dnum{font-family:var(--f-titulo);font-size:30px;color:var(--cafe-osc);line-height:1.2}
.dia .dmes{font-size:11.5px;color:var(--texto)}
.dia .dlibres{font-size:11px;margin-top:4px;color:var(--cafe);font-weight:500}
.dia.sel{background:var(--boton);border-color:transparent;box-shadow:0 8px 20px rgba(140,106,70,.3)}
.dia.sel .dsem,.dia.sel .dnum,.dia.sel .dmes,.dia.sel .dlibres{color:#fff}
.dia:disabled{opacity:.4;cursor:not-allowed}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.hora{border-radius:14px;padding:13px 8px;background:#fff;border:1px solid var(--borde);font-weight:500;color:var(--cafe-osc);font-size:15px;transition:all .15s}
.hora:hover:not(:disabled){border-color:var(--dorado);transform:translateY(-2px)}
.hora.sel{background:var(--boton);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(140,106,70,.3)}
.hora.tachada{background:#F4EEE7;color:#BEAE9E;border-color:#EAE0D4;text-decoration:line-through;text-decoration-thickness:1.5px;cursor:not-allowed}
.hora small{display:block;font-size:10.5px;font-weight:400;text-decoration:none;margin-top:2px}
.hora:disabled{cursor:not-allowed}
.nota-suave{text-align:center;font-size:12.5px;font-weight:300;color:var(--cafe-osc);margin-top:14px}
.leyenda{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:11.5px;margin-top:14px;color:var(--texto)}
.leyenda i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--borde);background:#fff}
.leyenda i.r{background:#F4EEE7;border-color:#EAE0D4}
.leyenda i.s{background:var(--cafe);border-color:var(--cafe)}
.btn-principal{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:440px;margin:24px auto 0;padding:16px 22px;border-radius:999px;font-weight:500;font-size:15.5px;letter-spacing:.04em;color:#fff;text-decoration:none;background:var(--boton);box-shadow:0 12px 26px rgba(140,106,70,.28);transition:transform .2s,opacity .2s}
.btn-principal:hover{transform:translateY(-2px)}
.btn-principal[aria-disabled="true"],.btn-principal:disabled{opacity:.45;pointer-events:none;box-shadow:none}

/* ---------- confirmación ---------- */
.resumen{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.resumen img{width:96px;height:96px;border-radius:22px;object-fit:cover;object-position:center 15%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--dorado)}
.resumen ul{list-style:none;display:grid;gap:5px;font-size:14px}
.resumen li b{color:var(--cafe-osc);font-weight:600}
.campo{display:block;margin-top:16px}
.campo span{display:block;font-weight:500;font-size:13px;color:var(--cafe-osc);margin-bottom:6px;letter-spacing:.02em}
.campo input{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--borde);font:inherit;font-size:16px;color:var(--texto);background:#fff;outline:none}
.campo input:focus{border-color:var(--dorado);box-shadow:0 0 0 3px rgba(201,165,94,.18)}
.campo .ayuda{font-size:12px;margin-top:6px;color:var(--texto)}
.campo .ayuda a{color:var(--cafe);font-weight:600}
.aviso{margin-top:20px;border-radius:20px;padding:18px 18px 16px;background:linear-gradient(#fff,#fff) padding-box,var(--oro) border-box;border:1.5px solid transparent;text-align:center}
.aviso .script{font-size:18px;display:block;margin-bottom:8px;color:var(--dorado)}
.aviso p{font-size:14px;line-height:1.6;font-weight:300}
.aviso strong{color:var(--cafe-osc);font-weight:600}
.politicas{display:grid;gap:12px;margin-top:16px}
.pol{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;background:var(--fondo);border:1px solid var(--borde);border-radius:18px;padding:12px 14px}
.pol .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--dorado)}
.pol h4{font-family:var(--f-titulo);font-weight:400;text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--cafe-osc);margin:4px 0 4px}
.pol p{font-size:13.5px;line-height:1.5;font-weight:300}
.acepto{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;font-weight:500;cursor:pointer}
.acepto input{width:20px;height:20px;accent-color:var(--cafe);flex:0 0 auto;margin-top:1px}
.wa-num{text-align:center;font-size:12.5px;margin-top:10px}

.exito{text-align:center;padding:30px 10px}
.exito .script{font-size:clamp(30px,8vw,52px)}
.exito p{max-width:520px;margin:14px auto 0;line-height:1.6;font-size:15px;font-weight:300}

/* modal */
.modal{position:fixed;inset:0;background:rgba(111,81,57,.28);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .caja{background:#fff;border-radius:26px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px 20px;box-shadow:0 20px 60px rgba(111,81,57,.3);position:relative;border:1px solid var(--borde)}
.modal .cerrar{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--fondo-2);color:var(--cafe-osc);font-size:20px}
.modal h3{font-family:var(--f-titulo);font-weight:400;text-transform:uppercase;letter-spacing:.16em;color:var(--cafe-osc);font-size:20px;text-align:center}

footer{text-align:center;margin-top:50px;font-size:12.5px;font-weight:300;color:var(--cafe-osc)}
footer .script{font-size:15px;display:block;margin-bottom:8px;color:var(--dorado);letter-spacing:.24em}
footer a{text-decoration:none;font-weight:500}

/* ---------- panel secretaria ---------- */
.admin-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:22px}
.admin-head h1{font-family:var(--f-titulo);color:var(--cafe-osc);font-weight:400;text-transform:uppercase;letter-spacing:.14em;font-size:26px;line-height:1}
.estado{font-size:12.5px;font-weight:600;border-radius:999px;padding:8px 14px;background:#fff;border:1px solid var(--borde)}
.estado.ok{color:#4f8a5b}.estado.mal{color:#b0563e}.estado.esp{color:var(--cafe)}
.fila-sel{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sel-btn{background:#fff;border:1px solid var(--borde);border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;color:var(--cafe-osc);display:inline-flex;align-items:center;gap:8px}
.sel-btn img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:center 15%}
.sel-btn.on{background:var(--boton);color:#fff;border-color:transparent}
.lbl{font-family:var(--f-titulo);color:var(--dorado);font-size:12px;margin-top:18px;text-transform:uppercase;letter-spacing:.2em}
.tabla-wrap{overflow-x:auto;margin-top:14px;border-radius:20px;background:#fff;border:1px solid var(--borde);box-shadow:var(--sombra);padding:10px}
table.grilla{border-collapse:separate;border-spacing:6px;min-width:640px;width:100%}
.grilla th{font-size:11px;color:var(--dorado);font-weight:500;text-transform:uppercase;letter-spacing:.1em;padding:4px}
.grilla th .n{display:block;font-family:var(--f-titulo);font-size:18px;color:var(--cafe-osc);letter-spacing:.04em;margin-top:2px}
.grilla th button{display:block;margin:6px auto 0;font-size:11px;font-weight:500;color:var(--cafe-osc);background:var(--fondo-2);border-radius:999px;padding:4px 8px;text-transform:none;letter-spacing:0}
.grilla td.h{font-weight:500;color:var(--cafe-osc);font-size:12.5px;white-space:nowrap;text-align:right;padding-right:6px}
.celda{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--borde);background:#fff;font-size:12px;font-weight:500;color:#6f9a78;padding:4px}
.celda.res{background:#F1E6D8;border-color:var(--cafe);color:var(--cafe-osc);text-decoration:line-through}
.celda.res .quien{display:block;text-decoration:none;font-weight:400;color:var(--cafe-osc);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;margin:0 auto}
.celda.espera{opacity:.5}
.celda.vacia{display:grid;place-items:center;border:1px dashed var(--borde);color:#cdbfae;background:transparent}
.nota-input{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.nota-input input{flex:1;min-width:220px;padding:12px 14px;border-radius:14px;border:1px solid var(--borde);font:inherit;font-size:15px;background:#fff}
.resumen-sem{margin-top:24px}
.resumen-sem h3{font-family:var(--f-titulo);color:var(--cafe-osc);font-weight:400;text-transform:uppercase;letter-spacing:.14em;font-size:18px}
.res-list{display:grid;gap:8px;margin-top:10px}
.res-item{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 14px;font-size:13.5px}
.res-item b{color:var(--cafe-osc);font-weight:600}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#fff;color:var(--cafe-osc);border:1px solid var(--borde);padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(111,81,57,.25);font-weight:500;font-size:13.5px;z-index:60;transition:transform .3s,visibility .3s;visibility:hidden;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}

.vista{animation:entrar .45s ease}
@keyframes entrar{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:520px){
  .artistas{grid-template-columns:repeat(2,1fr);gap:14px}
  .artista .cinta{font-size:13px;padding:6px 12px;letter-spacing:.16em}
  .artista .frase{font-size:11.5px}
  .semanas{grid-template-columns:repeat(2,1fr)}
  .semana .rango{font-size:17px}
}
</style>

const t_ = s => { const [h,m]=s.split(":").map(Number); return h*60+(m||0); };
function horasDe(aid, d){ const a=ARTISTAS.find(x=>x.id===aid); if(!a||!a.grupo) return [];
  const fx=HORAS_FIJAS[aid]; if(fx && d in fx) return fx[d] ? fx[d].split(" ").map(t_) : [];
  const ex=HORARIO_ARTISTA[aid], v=(ex && d in ex) ? ex[d] : HORARIO[d]; if(!v) return [];
  const [ini,fin]=v.split("-").map(t_), out=[]; let h=ini, comio=!a.almuerzo;
  while(h+a.duracion<=fin){ out.push(h); h+=a.duracion; if(!comio && h>=12*60){ h+=a.almuerzo; comio=true; } }
  return out; }

function pasada(d,h){
  const hoy=hoyISO(); if(d<hoy) return true;
  if(d===hoy){ const n=new Date(); return h!=null ? h <= n.getHours()*60+n.getMinutes() : false; }
  return false;
}
function libres(a,d){ return horasDe(a,d).filter(h=>!estaReservada(a,d,h) && !pasada(d,h)).length; }

async function escribir(art,d,h,reservar){
  const id=idRes(art,d,h);
  if(!db){ toast("No hay conexión con la agenda"); return false; }
  if(A.pendientes.has(id)) return false;
  A.pendientes.add(id);
  try{
    const ref=FB.doc(db,"reservas",id);
    if(reservar) await FB.setDoc(ref,{artista:art, fecha:d, hora:h, nota:A.nota.trim().slice(0,80), creado:Date.now()});
    else await FB.deleteDoc(ref);
    return true;
  }catch(e){
    if(e && (e.code==="permission-denied"||e.code==="unauthenticated")){ puedeEscribir=false; toast("Esta cuenta no tiene permiso para editar la agenda"); }
    else if(e && e.code==="unavailable"){ toast("Conexión inestable, intenta de nuevo"); }
    else toast("No se pudo guardar");
    return false;
  }finally{ A.pendientes.delete(id); render(); }
}

const esPanel = () => location.hash === "#"+PANEL_HASH;
function render(){
  const app=$("#app");
  if(esPanel()){ const y=window.scrollY, ae=document.activeElement, foco=ae&&ae.id==="in-nota", pos=foco?ae.selectionStart:0;
    const vc=$("#in-correo")?.value, vk=$("#in-clave")?.value, fid=ae&&["in-correo","in-clave"].includes(ae.id)?ae.id:null;
    app.innerHTML=vPanel(); window.scrollTo(0,y);
    if(vc!=null&&$("#in-correo")){ $("#in-correo").value=vc; $("#in-clave").value=vk||""; if(fid) $("#"+fid).focus(); }
    if(foco){ const i=$("#in-nota"); i.focus(); try{i.setSelectionRange(pos,pos);}catch(_){} } return; }
  const v={inicio:vInicio, artistas:vArtistas, agenda:vAgenda, confirmar:vConfirmar, exito:vExito}[S.vista]||vInicio;
  app.innerHTML=v();
}
function ir(vista){ S.vista=vista; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function rerenderSuave(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-accion]"); if(!b) return;
  const ac=b.dataset.accion;
  if(ac==="ir") ir(b.dataset.vista);
  else if(ac==="semana"){ S.semana=b.dataset.id; S.artista=null; S.dia=null; S.hora=null; ir("artistas"); }
  else if(ac==="artista"){ S.artista=b.dataset.id; S.dia=null; S.hora=null; ir("agenda"); }
  else if(ac==="dia"){ S.dia=b.dataset.d; S.hora=null; rerenderSuave(); const bh=$("#bloque-horas"); if(bh) bh.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(ac==="hora"){ S.hora=Number(b.dataset.h); rerenderSuave(); }
  else if(ac==="continuar"){ if(S.dia&&S.hora!=null) ir("confirmar"); }
  else if(ac==="enviar-wa"){
    if(!listoConfirmar()){ e.preventDefault(); toast(S.nombre.trim().length<2?TXT.faltaNombre:"Acepta las políticas para continuar"); return; }
    if(estaReservada(S.artista,S.dia,S.hora)){ e.preventDefault(); toast("Ups, ese horario acaba de reservarse. Elige otro"); S.hora=null; ir("agenda"); return; }
    b.href=waLink(); setTimeout(()=>ir("exito"),400);
  }
  else if(ac==="reiniciar"){ Object.assign(S,{vista:"inicio",semana:null,artista:null,dia:null,hora:null,servicio:"",acepto:false}); ir("inicio"); }
  else if(ac==="abrir-politicas"){ $("#politicas-modal").innerHTML=politicasHTML(); $("#modal-politicas").classList.add("open"); }
  else if(ac==="cerrar-politicas") $("#modal-politicas").classList.remove("open");
  /* panel */
  else if(ac==="salir"){ try{ await FB.signOut(auth); }catch(_){} }
  else if(ac==="a-semana"){ A.semana=b.dataset.id; render(); }
  else if(ac==="a-artista"){ A.artista=b.dataset.id; render(); }
  else if(ac==="a-celda"){ const d=b.dataset.d, h=Number(b.dataset.h); const ok=await escribir(A.artista,d,h,!estaReservada(A.artista,d,h)); if(ok) toast(estaReservada(A.artista,d,h)?"Horario marcado como reservado":"Horario liberado"); }
  else if(ac==="a-dia"){ const d=b.dataset.d, bloquear=b.dataset.modo==="bloquear";
    for(const h of horasDe(A.artista,d)){ if(estaReservada(A.artista,d,h)!==bloquear){ const ok=await escribir(A.artista,d,h,bloquear); if(!ok) break; } }
    toast(bloquear?"Día bloqueado":"Día liberado"); }
});
document.addEventListener("submit", async e=>{
  if(e.target.id!=="form-login") return;

  const correo=$("#in-correo").value.trim(), clave=$("#in-clave").value;
  entrando=true; loginError=""; render();
  try{ await FB.signInWithEmailAndPassword(auth, correo, clave); }
  catch(err){ loginError = (err&&err.code==="auth/too-many-requests") ? "Demasiados intentos. Espera un momento e inténtalo de nuevo." : "Correo o contraseña incorrectos."; }
  finally{ entrando=false; render(); }
});

(async function(){

      import(FIREBASE_SDK+"firebase-app.js"), import(FIREBASE_SDK+"firebase-firestore.js"), import(FIREBASE_SDK+"firebase-auth.js")]);
    FB = {...fs, ...au};
    const fapp = app.initializeApp(FIREBASE_CONFIG);
    db = fs.getFirestore(fapp); auth = au.getAuth(fapp);
  }catch(e){ console.error(e); clearTimeout(timer); dbEstado="sin"; authListo=true; if(esPanel()) render(); return; }
  FB.onAuthStateChanged(auth, u=>{ usuario=u; authListo=true; puedeEscribir=true; if(esPanel()) render(); });
  FB.onSnapshot(FB.collection(db,"reservas"), snap=>{
    reservas.clear();
    snap.docs.forEach(d=>{ const x=d.data(); if(x && typeof x.fecha==="string") reservas.set(d.id,x); });
    if(!snap.metadata.fromCache){ clearTimeout(timer); dbEstado="ok"; }
    if(S.hora!=null && S.dia && S.artista && estaReservada(S.artista,S.dia,S.hora) && S.vista==="agenda"){ S.hora=null; toast("Ese horario acaba de reservarse"); }
    if(esPanel() || ["agenda","artistas"].includes(S.vista)) rerenderSuave();
  }, err=>{ console.error(err); clearTimeout(timer); dbEstado="sin"; if(esPanel()) render(); });
})();
</script>
</body>
</html>
